<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">GoCarbonTracker (GCT)</title>
  <desc id="hero-desc">Every figure in a company report, traced to its page. The example is one claim gct read from the sample report in this repository: Total Scope 1 emissions, 1,240.5 tCO2e, on page 1, with the box on the page that holds the figure.</desc>

  <rect width="1200" height="420" rx="20" fill="#F7F4EC"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="20" fill="none" stroke="#14161A" stroke-width="1.5"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#1F6F4A">COMPANY CLIMATE REPORTS · CHECKABLE CLAIMS</text>
    <text x="-3" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#14161A">GoCarbonTracker</text>
    <rect x="0" y="206" width="96" height="4" fill="#14161A"/>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" fill="#14161A">
      <tspan x="0" y="262">Every figure in a company report,</tspan>
      <tspan x="0" y="300">traced to its page.</tspan>
    </text>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5B616B">
      <tspan x="0" y="348">runs on your own computer,</tspan>
      <tspan x="0" y="372">keeps every earlier version</tspan>
    </text>
  </g>

  <g id="project-proof" transform="translate(664 44)">
    <clipPath id="card"><rect width="472" height="332" rx="12"/></clipPath>
    <g clip-path="url(#card)">
      <rect width="472" height="332" fill="#FFFFFF"/>
      <rect y="284" width="472" height="48" fill="#14161A"/>
    </g>
    <rect width="472" height="332" rx="12" fill="none" stroke="#14161A" stroke-width="1.5"/>

    <text x="24" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5B616B">sample_sustainability_report.pdf</text>
    <text x="24" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#14161A">Total Scope 1 emissions</text>
    <line x1="24" y1="96" x2="448" y2="96" stroke="#14161A" stroke-width="1"/>

    <!-- the figure as printed, with the box gct stored for it -->
    <rect x="24" y="116" width="250" height="62" rx="6" fill="#E3F0E8" stroke="#1F6F4A" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="40" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#14161A">1,240.5</text>
    <text x="196" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#14161A">tCO2e</text>
    <text x="448" y="154" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#1F6F4A">page 1</text>

    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#14161A">
      <tspan x="24" y="212">period    FY 2024-25</tspan>
      <tspan x="24" y="238">box       324, 224, 364, 236</tspan>
      <tspan x="24" y="264">source    matched</tspan>
    </text>

    <text x="24" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#F7F4EC">$ gct claims list --doc 1</text>
  </g>
</svg>
